<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realtime Source Code Analyzer</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <h1>Realtime Source Code Analyzer</h1>

        <div class="repo-section">
            <input type="text" id="repo-url" placeholder="Enter GitHub Repository URL">
            <button id="load-repo">Load Repository</button>
        </div>

        <div class="chat-container" id="chat-container"></div>

        <div class="input-section">
            <input type="text" id="message" placeholder="Ask about the repository...">
            <button id="send">Send</button>
        </div>

    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>



</body>

</html>
